<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />

    <title>Form Pemesanan</title>
  </head>
  <body>
    <section class="py-5" style="background-color: rgb(236, 236, 255);">
      <div class="container">
        <!-- Judul -->
        <div class="text-center mb-5">
          <h2 class="fw-bold">Form Pemesanan Paket Wisata</h2>
          <p class="text-muted">Silakan isi data di bawah ini untuk melakukan pemesanan paket wisata pilihan Anda.</p>
        </div>

        <div class="row justify-content-center">
          <div class="col-lg-8">
            <!-- Form -->
            <form id="orderForm" class="p-4 border rounded-4 bg-white shadow-sm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Nama Lengkap</label>
                  <input type="text" class="form-control" required />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" required />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Nomor Telepon</label>
                  <input type="tel" class="form-control" required />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Pilih Paket Wisata</label>
                  <select class="form-select" required>
                    <option selected disabled value="">-- Pilih Paket --</option>
                    <option>Raja Ampat</option>
                    <option>Bromo Sunrise</option>
                    <option>Danau Toba</option>
                    <option>Ubud Bali</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Tanggal Keberangkatan</label>
                  <input type="date" class="form-control" required />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Jumlah Peserta</label>
                  <input type="number" class="form-control" min="1" required />
                </div>

                <div class="col-12">
                  <label class="form-label">Metode Pembayaran</label>
                  <select class="form-select" required>
                    <option selected disabled value="">-- Pilih Metode --</option>
                    <option>Transfer Bank</option>
                    <option>E-Wallet</option>
                    <option>Kartu Kredit</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label">Catatan Tambahan</label>
                  <textarea class="form-control" rows="4"></textarea>
                </div>

                <div class="col-12 text-center mt-4">
                  <button type="submit" class="btn btn-primary px-5 py-2">Pesan Sekarang</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- Modal Popup -->
    <div class="modal fade" id="successModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Pemesanan Berhasil</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <p>Data pesanan Anda sudah tersimpan. Terima kasih telah melakukan pemesanan.</p>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPT -->
    <script>
      const form = document.getElementById('orderForm');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const modal = new bootstrap.Modal(document.getElementById('successModal'));

        modal.show();
        form.reset();
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
